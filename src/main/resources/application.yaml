spring:
  application:
    name: ifs25030-p6-pbo2026-springboot-cashflow
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:${PORT:8080}}
  # Aplikasi berjalan di belakang reverse proxy (nginx): hormati header X-Forwarded-*
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true

# Cache aset statis (ikon, css) agar skor Lighthouse Performance lebih baik
spring.web.resources.cache.cachecontrol.max-age: 7d
